services:
  - type: web
    name: datavault-ai-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_FAST_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_COMPLEX_MODEL
        value: llama-3.3-70b-versatile
      - key: DEFAULT_DATASET_PATH
        value: sample-data/Chile_real_estate_listings.csv
      - key: GROQ_API_KEY
        sync: false
